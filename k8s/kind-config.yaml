# Local cluster for the ride classifier:
#   kind create cluster --name ride --config k8s/kind-config.yaml
# The two NodePorts of the services are published on the host:
#   API      -> http://localhost:8080/docs
#   Web app  -> http://localhost:8501
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # Service ride-api
        hostPort: 8080
        protocol: TCP
      - containerPort: 30501 # Service ride-webapp
        hostPort: 8501
        protocol: TCP
