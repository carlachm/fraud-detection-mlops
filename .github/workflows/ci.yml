# CI/CD: every pull request is linted, tested and its Docker image is built and
# smoke-tested. On main, the image is also pushed to Docker Hub, tagged with the commit.
#
#   lint ──┐
#          ├──> docker (build -> smoke test -> push if main)
#   test ──┘
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]  # doc-only commits do not need a new image
  workflow_dispatch:

# A new push on the same branch cancels the previous (now useless) run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: read the code, nothing else
permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"
  IMAGE_NAME: fraud-detection-train

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lockfile is up to date with pyproject.toml
        run: uv lock --check
      - name: Install ruff only
        run: uv sync --locked --only-group lint
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install project + test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Unit + integration tests (data validation, model, MLflow registry)
        run: uv run --no-sync pytest --cov=fraud_detection --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  docker:
    name: docker
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tag (short commit SHA, never latest)
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.DOCKERHUB_USERNAME || 'local' }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1) Build for the runner's architecture and load it locally to test it
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Test the container, not only the build
      - name: Smoke test (full pipeline on synthetic data)
        run: bash scripts/smoke_test.sh ${{ env.IMAGE_NAME }}:ci

      # 3) Only on main: publish a multi-arch image (amd64 for CI/cloud, arm64 for Apple Silicon Macs)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (arm64 emulation)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "### Image published :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://hub.docker.com/r/${{ steps.meta.outputs.image }}/tags" >> "$GITHUB_STEP_SUMMARY"
