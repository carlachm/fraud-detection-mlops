[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "MLOps pipeline for credit card fraud detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Exact versions are pinned in requirements.txt (reproducibility)
dependencies = [
    "mlflow>=3.10",
    "torch>=2.4",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "boto3>=1.34",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "dvc[s3]>=3.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
